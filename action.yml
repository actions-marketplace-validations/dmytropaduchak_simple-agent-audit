name: Simple Agent Audit
description: Warn when agent/AI config files change in a pull request.
author: Dmytro Paduchak
branding:
  icon: cpu
  color: purple
inputs:
  github-token:
    description: Token to read PR/repo data and post sticky comments.
    required: false
    default: ${{ github.token }}
  fail-on:
    description: "none = report only; medium or high = fail when findings match."
    required: false
    default: none
runs:
  using: node20
  main: dist/index.js
